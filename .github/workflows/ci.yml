name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'backlog/**'
  pull_request:
    branches: [main]
    # PR では paths-ignore を使わない。必須チェック（Quality gate summary / pullfrog-approval）が
    # 付かない PR があるとマージできなくなるため、docs-only でも必ずゲートを通す。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene & Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Zig 0.17 FFI rules (no @cImport / @cInclude)
        run: |
          if grep -rnE '@(cImport|cInclude)[[:space:]]*\(' lib/quasifind/*.zig; then
            echo "Error: @cImport / @cInclude is prohibited in Zig 0.17 FFI stubs (see AGENTS.md)."
            exit 1
          fi

      - name: Check Dune macOS framework flag rule (lib/dune)
        run: |
          if grep -nE -- '-F[[:space:]]+\$\(xcrun --show-sdk-path\)' lib/dune; then
            echo "Error: Do not pass SDK path prefix to -F in lib/dune; use -F /System/Library/Frameworks (see AGENTS.md)."
            exit 1
          fi

      - name: Check Backlog task ID uniqueness
        run: |
          if [ -d backlog/tasks ]; then
            dups=$(grep -hE '^id: ' backlog/tasks/*.md | sort | uniq -d)
            if [ -n "$dups" ]; then
              echo "Error: Duplicate Backlog task IDs found:"
              echo "$dups"
              exit 1
            fi
          fi

  build_and_test:
    name: Build & Test (macOS Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: |
          arch=$(uname -m)
          echo "Runner architecture: $arch"
          if [ "$arch" != "arm64" ]; then
            echo "Error: quasifind requires Apple Silicon (arm64) runner."
            exit 1
          fi

      - name: Setup Zig 0.17
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"

      - name: Setup OCaml 5.5
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.x"
          dune-cache: true
          opam-pin: true

      - name: Install OPAM dependencies
        run: opam install . --deps-only --with-test -y

      - name: Build project
        run: opam exec -- dune build

      - name: Run unit, property, and Cram tests
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/qf_xdg/config
          XDG_DATA_HOME: ${{ runner.temp }}/qf_xdg/data
          XDG_CACHE_HOME: ${{ runner.temp }}/qf_xdg/cache
        run: |
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          opam exec -- dune runtest --force

      - name: Build documentation (odoc check, advisory until TASK-19)
        id: odoc
        continue-on-error: true
        run: |
          opam install odoc -y
          opam exec -- dune build @doc

  summary:
    name: Quality gate summary
    runs-on: ubuntu-latest
    needs: [hygiene, build_and_test]
    if: always()

    steps:
      - name: Write job summary
        run: |
          {
            echo "## Quality gates"
            echo ""
            echo "| gate | result |"
            echo "| --- | --- |"
            echo "| hygiene & guardrails | ${{ needs.hygiene.result }} |"
            echo "| build & test (macOS arm64) | ${{ needs.build_and_test.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require both gates to pass
        if: needs.hygiene.result != 'success' || needs.build_and_test.result != 'success'
        run: |
          echo "One or more quality gates did not pass. See the table above."
          exit 1
